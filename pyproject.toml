[project]
name = "bondi-demo-project"
version = "0.1.0"
description = "A student starting point for reproducible document database experiments"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "bondi==0.1.3",
    "yanex==0.6.1",
]

[tool.uv]
package = false

[dependency-groups]
dev = ["pytest>=8,<9", "ruff>=0.9,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
