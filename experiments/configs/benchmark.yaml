# default index set to use from below
index_set: "baseline"

# Each scenario lists BONDI definitions for the prepared collection.
# fields is shorthand for an ascending FieldIndex, including names with spaces.
indexes:
  baseline: []
  single:
    - fields: [City]
    - fields: [Model Year]
    - fields: [Make]
    - fields: [State]
    - fields: [Color]
  compound:
    - fields: [Make, Model Year]
    - fields: [City, Color, Model Year]
    - fields: [State, Color]
    - fields: [Make, City]

warmups: 1
repetitions: 3 
timeout_seconds: 60
