# default index set to use from below
index_set: "baseline"

# Each scenario lists BONDI definitions for the prepared collection.
# Shared fields use ascending directions; native MongoDB keys allow "Model Year".
indexes:
  baseline: []
  single:
    - fields: [City]
    - kind: mongodb
      keys: [[Model Year, 1]]
    - fields: [Make]
    - fields: [State]
    - fields: [Color]
  compound:
    - kind: mongodb
      keys: [[Make, 1], [Model Year, 1]]
    - kind: mongodb
      keys: [[City, 1], [Color, 1], [Model Year, 1]]
    - fields: [State, Color]
    - fields: [Make, City]

warmups: 1
repetitions: 3 
timeout_seconds: 60
