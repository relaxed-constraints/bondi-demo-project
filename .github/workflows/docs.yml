# Project-owned deployment policy: consumer projects publish from main.
name: Documentation
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
  docs:
    needs: checks
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: relaxed-constraints/relcon-docs/.github/workflows/deploy-docs.yml@7a65409737b9e17086232b87ac95160ae58b2199
