# When adapting this template, update the project name, description and URLs.
[project]
site_name = "BONDI Demo Project"
site_description = "A starter for reproducible database research with BONDI and Yanex"
site_url = "https://relaxed-constraints.github.io/bondi-demo-project/"
repo_url = "https://github.com/relaxed-constraints/bondi-demo-project"
repo_name = "relaxed-constraints/bondi-demo-project"
copyright = "Copyright &copy; 2026 Relaxed Constraints"
extra_css = ["stylesheets/markdown-copy.css", "stylesheets/diagrams.css"]
nav = [
 { "Home" = "index.md" },
 { "Getting started" = [{ "Installation" = "installation.md" }, { "Quickstart" = "quickstart.md" }] },
 { "User guide" = "user-guide.md" },
 { "Tutorials" = [{ "Overview" = "1_general.md" }, { "Prepare data" = "2_preparation.md" }, { "Generate workloads" = "3_workload.md" }, { "Benchmark indexes" = "4_benchmark.md" }, { "Analyse results" = "5_analysis.md" }] },
 { "Reference" = "reference.md" },
 { "Results" = "results.md" },
 { "Development" = [{ "Contributing" = "development.md" }, { "Documentation" = "documentation.md" }] }
]

[project.theme]
variant = "modern"
font = false
features = ["content.action.copy", "content.tabs.link", "content.code.copy", "navigation.tabs", "navigation.top", "search.highlight"]

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
toggle.icon = "lucide/moon"
toggle.name = "Switch to system preference"

[project.markdown_extensions.admonition]

[project.markdown_extensions."pymdownx.details"]

[project.markdown_extensions."pymdownx.highlight"]

[project.markdown_extensions."pymdownx.superfences"]
custom_fences = [
    { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]

[project.markdown_extensions."pymdownx.tabbed"]
alternate_style = true

[project.plugins.search]

[project.plugins.mkdocstrings.handlers.python]
paths = ["src"]

[project.plugins.mkdocstrings.handlers.python.options]
docstring_style = "google"
show_root_heading = true
heading_level = 2
show_signature_annotations = true
separate_signature = true
signature_crossrefs = true
line_length = 76

